spring.application.name=Chatop
server.port=${CHATOP_SERVER_PORT:3001}
spring.datasource.url=${CHATOP_DB_URL}
spring.datasource.username=${CHATOP_DB_USERNAME}
spring.datasource.password=${CHATOP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
chatop.jwt.secret=${CHATOP_JWT_SECRET}
chatop.images.directory=${CHATOP_IMAGES_DIRECTORY:uploads}
chatop.images.base-url=${CHATOP_IMAGES_BASE_URL:http://localhost:3001/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
